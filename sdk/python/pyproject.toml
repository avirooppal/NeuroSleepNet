[project]
name = "neurosleepnet"
version = "0.1.0"
description = "NeuroSleepNet — A Sleep-Inspired Hybrid Memory Layer for Continual AI Learning"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
nsn-bench = "neurosleepnet.benchmark.cli:main"

[project.optional-dependencies]
local_llm = [
    "transformers>=4.38.0",
    "torch>=2.0.0",
    "accelerate>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
