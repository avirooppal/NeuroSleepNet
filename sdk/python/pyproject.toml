[project]
name = "neurosleepnet"
version = "0.1.1"
description = "NeuroSleepNet — A Sleep-Inspired Hybrid Memory Layer for Local AI Agents"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Aviroop Pal", email = "palaviroopoff@gmail.com" }
]
keywords = ["llm", "memory", "ai", "continual-learning", "agent", "neurosleepnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/avirooppal/NeuroSleepNet"
Documentation = "https://github.com/avirooppal/NeuroSleepNet#readme"
Repository = "https://github.com/avirooppal/NeuroSleepNet.git"
Issues = "https://github.com/avirooppal/NeuroSleepNet/issues"

[project.scripts]
nsn-bench = "neurosleepnet.benchmark.cli:main"

[project.optional-dependencies]
local_llm = [
    "transformers>=4.38.0",
    "torch>=2.0.0",
    "accelerate>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
