[project]
name = "neurosleepnet"
version = "0.4.0"
description = "NeuroSleepNet — Enterprise-grade persistent memory and governance layer for AI agents with adaptive retrieval and consolidation."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Aviroop Pal", email = "palaviroopoff@gmail.com" }
]
keywords = ["llm", "memory", "ai", "continual-learning", "agent", "neurosleepnet", "nsn", "slm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "fastembed>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/avirooppal/NeuroSleepNet"
Documentation = "https://github.com/avirooppal/NeuroSleepNet#readme"
Repository = "https://github.com/avirooppal/NeuroSleepNet.git"
Issues = "https://github.com/avirooppal/NeuroSleepNet/issues"

[project.scripts]
nsn = "neurosleepnet.cli:main"

[project.optional-dependencies]
local = [
    "fastembed>=0.4.0",
]
openai = [
    "openai>=1.0.0",
]
all = [
    "fastembed>=0.4.0",
    "openai>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neurosleepnet", "nsn"]
