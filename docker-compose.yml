services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://nsn:nsn@db:5432/neurosleepnet
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://nsn:nsn@db:5432/neurosleepnet
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uv run python -m app.workers.stream_worker

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neurosleepnet}
      POSTGRES_USER: ${POSTGRES_USER:-nsn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nsn}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nsn} -d ${POSTGRES_DB:-neurosleepnet}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  nsn-embed:
    build:
      context: ./services/embed
      dockerfile: Dockerfile
    environment:
      - MODEL=BAAI/bge-small-en-v1.5
    ports:
      - "8001:8001"
    deploy:
      resources:
        limits:
          memory: 2g

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - api

volumes:
  pgdata:
