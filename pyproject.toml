[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk/python/neurosleepnet"]
include = [
    "sdk/python/neurosleepnet/**",
    "sdk/python/pyproject.toml",
    "sdk/python/README.md",
]

[project]
name = "neurosleepnet"
version = "2.0.0"
description = "The Synthetic Reasoning Engine for Continual AI Learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "NeuroSleepNet Team", email = "team@neurosleepnet.dev"},
]
maintainers = [
    {name = "NeuroSleepNet Team", email = "team@neurosleepnet.dev"},
]
keywords = [
    "ai",
    "memory",
    "llm",
    "embedding",
    "vector-database",
    "synthetic-reasoning",
    "machine-learning",
    "cognitive-architecture",
    "persistent-memory",
    "sleep-consolidation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/your-org/NeuroSleepNet"
Documentation = "https://docs.neurosleepnet.dev"
Repository = "https://github.com/your-org/NeuroSleepNet.git"
"Bug Tracker" = "https://github.com/your-org/NeuroSleepNet/issues"
Changelog = "https://github.com/your-org/NeuroSleepNet/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/your-org/NeuroSleepNet/security"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
