description = "NeuroSleepNet — Plug-and-play local library and dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.3.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
