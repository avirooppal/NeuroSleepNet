[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "sdk/python/neurosleepnet",
    "sdk/python/nsn",
    "distributed"
]
include = [
    "sdk/python/neurosleepnet/**",
    "sdk/python/nsn/**",
    "distributed/**",
    "sdk/python/pyproject.toml",
    "sdk/python/README.md",
]

[project]
name = "neurosleepnet"
version = "2.0.0"
description = "The Synthetic Reasoning Engine for Continual AI Learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "NeuroSleepNet Team", email = "team@neurosleepnet.dev"},
]
maintainers = [
    {name = "NeuroSleepNet Team", email = "team@neurosleepnet.dev"},
]
keywords = [
    "ai",
    "memory",
    "llm",
    "embedding",
    "vector-database",
    "synthetic-reasoning",
    "machine-learning",
    "cognitive-architecture",
    "persistent-memory",
    "sleep-consolidation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/your-org/NeuroSleepNet"
Documentation = "https://docs.neurosleepnet.dev"
Repository = "https://github.com/your-org/NeuroSleepNet.git"
"Bug Tracker" = "https://github.com/your-org/NeuroSleepNet/issues"
Changelog = "https://github.com/your-org/NeuroSleepNet/blob/main/CHANGELOG.md"
"Security Policy" = "https://github.com/your-org/NeuroSleepNet/security"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "W", "F", "I", "B", "C4", "UP"]
lint.ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "F821",  # undefined name - allow for adapter files
    "F841",  # unused variable - allow for dashboard variables
    "F401",  # imported but unused - allow for conditional imports
    "E701",  # multiple statements on one line - allow for compact code
    "E722",  # bare except - allow for simple error handling
    "UP035",  # import from collections.abc instead of Generator
    "UP037",  # typing.Dict is deprecated
    "UP006",  # use dict instead of Dict for type annotations
    "UP045",  # non-pep604-annotation-optional
    "I001",  # unsorted-imports
    "W291",  # trailing-whitespace
    "W293",  # blank-line-with-whitespace
    "E402",  # module-import-not-at-top-of-file
    "B010",  # set-attr-with-constant
    "B904",  # raise-without-from-inside-except
    "UP015",  # redundant-open-modes
    "B004",  # unreliable-callable-check
    "B007",  # unused-loop-control-variable
    "B009",  # get-attr-with-constant
    "B027",  # empty-method-without-abstract-decorator
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
]
